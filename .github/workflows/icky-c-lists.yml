name: Icky C list examples

on:
  pull_request:
    paths:
      - '*.c'
      - 'Makefile'
      - 'ICKY-C.md'
      - 'ci/**'
      - '.github/workflows/icky-c-lists.yml'
  push:
    branches: [master]
    paths:
      - '*.c'
      - 'Makefile'
      - 'ICKY-C.md'
      - 'ci/**'
      - '.github/workflows/icky-c-lists.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@f538ed81669ceb2d521b65fc3b3af7c2e51dd2f2
        id: ick
      - name: Compile and execute the two converted examples
        run: make ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}" smoke
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: f538ed81669ceb2d521b65fc3b3af7c2e51dd2f2
          path: .source-policy
          persist-credentials: false
      - name: Enforce assignments in the converted source
        run: make -f .source-policy/c-source/Makefile ICK="${{ steps.ick.outputs.compiler }}" check FILES="arrays_n_pointers.c print_environ.c"
